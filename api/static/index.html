<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Performance Predictor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; padding: 20px;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #7b2ff7, #f107a3);
    background-size: 400% 400%; animation: gradient 15s ease infinite;
  }
  @keyframes gradient { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }
  .card {
    width: 100%; max-width: 460px; padding: 32px; border-radius: 24px;
    background: rgba(255,255,255,0.14); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: rise .8s ease both;
  }
  @keyframes rise { from {opacity: 0; transform: translateY(30px)} to {opacity: 1; transform: none} }
  h1 { font-size: 1.5rem; text-align: center; }
  .badge { display: block; width: fit-content; margin: 10px auto 24px; padding: 4px 14px;
    border-radius: 999px; background: rgba(255,255,255,0.2); font-size: .8rem; }
  .field { margin-bottom: 18px; }
  .field label { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 6px; }
  .field output { font-weight: 700; }
  input[type=range] { width: 100%; accent-color: #fff; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 14px; font-size: 1rem; font-weight: 700;
    color: #2a2a72; background: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  button:active { transform: scale(.98); }
  .result { display: none; margin-top: 24px; text-align: center; }
  .ring { position: relative; width: 160px; height: 160px; margin: 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .bg { stroke: rgba(255,255,255,0.2); }
  .ring .fg { stroke: #fff; stroke-dasharray: 440; stroke-dashoffset: 440;
    transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1), stroke .4s; }
  .ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 800; }
  .verdict { margin-top: 12px; font-size: 1.3rem; font-weight: 800; }
  .shake { animation: shake .5s; }
  @keyframes shake { 0%,100% {transform: translateX(0)} 20%,60% {transform: translateX(-8px)} 40%,80% {transform: translateX(8px)} }
  .history { margin-top: 20px; font-size: .78rem; }
  .history div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,.15); display: flex; justify-content: space-between; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="card" id="card">
  <h1>🎓 Student Performance Predictor</h1>
  <span class="badge" id="badge">Loading model…</span>

  <div class="field">
    <label for="study">Study hours per day <output id="studyVal">5</output></label>
    <input type="range" id="study" min="0" max="10" step="0.5" value="5">
  </div>
  <div class="field">
    <label for="attendance">Attendance (%) <output id="attendanceVal">75</output></label>
    <input type="range" id="attendance" min="40" max="100" step="1" value="75">
  </div>
  <div class="field">
    <label for="marks">Previous marks <output id="marksVal">60</output></label>
    <input type="range" id="marks" min="0" max="100" step="1" value="60">
  </div>

  <button id="go">Predict</button>

  <div class="result" id="result">
    <div class="ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle class="bg" cx="80" cy="80" r="70"/>
        <circle class="fg" id="fg" cx="80" cy="80" r="70"/>
      </svg>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="history" id="history"></div>
</div>

<script>
const $ = id => document.getElementById(id);

[["study", "studyVal"], ["attendance", "attendanceVal"], ["marks", "marksVal"]].forEach(([i, o]) => {
  $(i).addEventListener("input", () => { $(o).textContent = $(i).value; });
});

fetch("/metrics").then(r => r.json()).then(m => {
  const acc = m.accuracies[m.best_model];
  $("badge").textContent = m.best_model.replace(/_/g, " ") + " · accuracy " + (acc * 100).toFixed(0) + "%";
}).catch(() => { $("badge").textContent = "Model info unavailable"; });

function loadHistory() {
  fetch("/history").then(r => r.json()).then(rows => {
    $("history").innerHTML = rows.length
      ? "<strong>Recent predictions</strong>" + rows.slice(0, 5).map(r =>
          `<div><span>${r.study_hours}h · ${r.attendance}% · ${r.previous_marks}</span>` +
          `<span>${r.passed ? "Pass" : "Fail"} (${Math.round(r.probability * 100)}%)</span></div>`).join("")
      : "";
  }).catch(() => {});
}
loadHistory();

$("go").addEventListener("click", async () => {
  const body = {
    study_hours: +$("study").value,
    attendance: +$("attendance").value,
    previous_marks: +$("marks").value,
  };
  const res = await fetch("/predict", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!res.ok) { alert("Prediction failed"); return; }
  showResult(await res.json());
  loadHistory();
});

function showResult(d) {
  const pct = Math.round(d.probability * 100);
  $("result").style.display = "block";
  const fg = $("fg");
  fg.style.transition = "none";
  fg.style.strokeDashoffset = 440;
  fg.getBoundingClientRect();
  fg.style.transition = "";
  fg.style.stroke = d.passed ? "#7CFFB2" : "#FF8A8A";
  requestAnimationFrame(() => { fg.style.strokeDashoffset = 440 * (1 - d.probability); });

  const start = performance.now();
  (function tick(now) {
    const t = Math.min((now - start) / 1200, 1);
    $("pct").textContent = Math.round(pct * t) + "%";
    if (t < 1) requestAnimationFrame(tick);
  })(start);

  $("verdict").textContent = d.passed ? "✅ Likely to PASS" : "❌ At risk of FAILING";
  if (d.passed) { confetti(); }
  else { const c = $("card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
}

function confetti() {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#ffd166", "#06d6a0", "#ef476f", "#118ab2", "#ffffff"];
  const parts = Array.from({length: 120}, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    r: 4 + Math.random() * 5, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3,
    c: colors[Math.floor(Math.random() * colors.length)],
  }));
  let frames = 0;
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r * 1.6); });
    if (++frames < 180) requestAnimationFrame(draw); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}
</script>
</body>
</html>
